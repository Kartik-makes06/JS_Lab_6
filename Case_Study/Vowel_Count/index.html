<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowel Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Vowel Counter</h1>
            <p>Count the number of vowels in your paragraph</p>
        </div>

        <div class="input-section">
            <label for="paragraphInput">Enter Your Paragraph</label>

            <textarea id="paragraphInput" placeholder="Type or paste your paragraph here..."></textarea>

            <button onclick="countVowels()">Count Vowels</button>
        </div>

        <div class="result-section">
            <h2>Result</h2>

            <div class="result-box">
                <span id="vowelCount">0</span>
                <p>Vowels Found</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
